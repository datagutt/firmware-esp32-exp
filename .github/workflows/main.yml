name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    # Pinned ESP-IDF master image (built 2026-09-25). Bump the digest on purpose
    # and rebuild every board when moving to a newer IDF.
    container: espressif/idf@sha256:14636bd86a66be991e297a1075d8bf89d113a68f9c747b974ef26373376e6d39
    env:
      IDF_CCACHE_ENABLE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Install Host Tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cppcheck cmake g++

      - name: cppcheck
        run: |
          cppcheck --enable=warning,performance,portability \
            --force \
            --error-exitcode=1 \
            --inline-suppr \
            -I main \
            -I main/network \
            -I main/system \
            main \
            components/assets

      - name: Fetch Managed Components
        shell: bash
        run: |
          set -o pipefail
          . $IDF_PATH/export.sh
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.tronbyt-s3" set-target esp32s3 reconfigure 2>&1 | tee reconfigure.log
          # The component manager only re-solves when dependencies.lock no longer
          # matches the idf_component.yml manifests. Builds must use the committed lock.
          if grep -q "solving dependencies" reconfigure.log; then
            echo "::error::dependencies.lock is out of date. Run idf.py update-dependencies and commit the updated lock."
            exit 1
          fi
          # A changed git pin does not trigger a re-solve on its own, so compare
          # every git dependency's pinned version with the one in the lock.
          python - <<'EOF'
          import re, subprocess, sys, yaml
          lock = yaml.safe_load(open("dependencies.lock"))["dependencies"]
          stale = []

          def pinned_shas(url, version):
              if re.fullmatch(r"[0-9a-f]{40}", version):
                  return {version}
              # A tag: the lock records the tag object (or the commit for a
              # lightweight tag), so accept both.
              out = subprocess.run(["git", "ls-remote", url, f"refs/tags/{version}",
                                    f"refs/tags/{version}^{{}}"],
                                   capture_output=True, text=True, check=True).stdout
              return {line.split()[0] for line in out.splitlines()}

          for manifest in ("main/idf_component.yml", "components/webp_decoder/idf_component.yml"):
              for name, spec in (yaml.safe_load(open(manifest)).get("dependencies") or {}).items():
                  if isinstance(spec, dict) and "git" in spec and "version" in spec:
                      locked = lock.get(name, {}).get("version")
                      if locked not in pinned_shas(spec["git"], spec["version"]):
                          stale.append(f"{name}: manifest {spec['version']}, lock {locked}")
          if stale:
              print("::error::dependencies.lock pins other git versions than the manifests: " + "; ".join(stale))
              sys.exit(1)
          EOF

      - name: Host Tests
        run: bash test/host/run_tests.sh

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    runs-on: ubuntu-latest
    # Pinned ESP-IDF master image (built 2026-09-25). Bump the digest on purpose
    # and rebuild every board when moving to a newer IDF.
    container: espressif/idf@sha256:14636bd86a66be991e297a1075d8bf89d113a68f9c747b974ef26373376e6d39
    strategy:
      fail-fast: false
      matrix:
        target:
          - tidbyt-gen1
          - tidbyt-gen1_swap
          - tidbyt-gen2
          - tronbyt-s3
          - tronbyt-s3-wide
          - pixoticker
          - matrixportal-s3
          - matrixportal-s3-wide
          - matrixportal-s3-waveshare
          - waveshare-s3

    env:
      IDF_CCACHE_ENABLE: "1"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Git Safe Directory
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ matrix.target }}-${{ hashFiles('**/sdkconfig.defaults*') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.target }}-

      - name: Generate version header
        run: |
          if git describe --tags --abbrev=0 2>/dev/null; then
            VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          else
            VERSION=$(git describe --always --dirty)
          fi
          echo "Firmware version: $VERSION"

          cat > main/version.h << EOF
          // Auto-generated file - DO NOT EDIT
          // Generated by GitHub Actions
          #pragma once
          #define FIRMWARE_VERSION "$VERSION"
          EOF

      - name: Build Target
        run: |
          . $IDF_PATH/export.sh
          target="${{ matrix.target }}"
          echo "--------------------------------------"
          echo "Building target: $target"
          echo "--------------------------------------"

          # Determine chip type based on target
          case "$target" in
            tronbyt-s3*|matrixportal-s3*|waveshare-s3*)
              chip="esp32s3"
              ;;
            *)
              chip="esp32"
              ;;
          esac

          BUILD_DIR="build_$target"

          # Set the target and apply sdkconfig defaults
          idf.py -B "$BUILD_DIR" -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.$target" set-target "$chip"
          idf.py -B "$BUILD_DIR" build

          if [ ! -f "$BUILD_DIR/firmware.bin" ]; then
            echo "❌ Failed to generate firmware for $target"
            exit 1
          fi

          # Generate merged binary
          echo "Generating merged binary for $chip..."
          # Run esptool from within the build directory so relative paths in flash_args work
          (cd "$BUILD_DIR" && python -m esptool --chip "$chip" merge-bin -o "merged_firmware.bin" @flash_args)

          # Generate OTA bundle (app + optional webui)
          if [ -f "$BUILD_DIR/webui.bin" ]; then
            python tools/create_bundle.py "$BUILD_DIR/firmware.bin" --webui "$BUILD_DIR/webui.bin" -o "$BUILD_DIR/bundle.bin"
          else
            python tools/create_bundle.py "$BUILD_DIR/firmware.bin" -o "$BUILD_DIR/bundle.bin"
          fi

          # Rename for artifact upload
          mv "$BUILD_DIR/firmware.bin" "${target}_firmware.bin"
          mv "$BUILD_DIR/merged_firmware.bin" "${target}_merged.bin"
          mv "$BUILD_DIR/bundle.bin" "${target}_bundle.bin"

      - name: Size Delta Check
        if: github.event_name == 'pull_request'
        run: |
          . $IDF_PATH/export.sh
          target="${{ matrix.target }}"

          case "$target" in
            tronbyt-s3*|matrixportal-s3*|waveshare-s3*)
              chip="esp32s3"
              ;;
            *)
              chip="esp32"
              ;;
          esac

          BASE_SHA="$(git merge-base HEAD origin/main)"
          if [ -z "$BASE_SHA" ]; then
            echo "No merge-base found; skipping size delta check"
            exit 0
          fi

          WT="/tmp/base-${target}-${BASE_SHA:0:8}"
          git worktree add "$WT" "$BASE_SHA"
          cp secrets.cmake "$WT/secrets.cmake" || true

          pushd "$WT"
          idf.py -B build_base -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.$target" set-target "$chip"
          idf.py -B build_base build
          BASE_SIZE=$(stat -c%s build_base/firmware.bin)
          popd

          HEAD_SIZE=$(stat -c%s "${target}_firmware.bin")
          DELTA=$((HEAD_SIZE - BASE_SIZE))
          LIMIT=32768
          echo "Base size: $BASE_SIZE"
          echo "Head size: $HEAD_SIZE"
          echo "Delta: $DELTA bytes (limit: +$LIMIT)"

          git worktree remove "$WT" --force

          if [ "$DELTA" -gt "$LIMIT" ]; then
            echo "Firmware size regression too large for $target: +$DELTA bytes"
            exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.target }}_firmware
          path: |
            ${{ matrix.target }}_firmware.bin
            ${{ matrix.target }}_merged.bin
            ${{ matrix.target }}_bundle.bin
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts
          pattern: "*_firmware"
          merge-multiple: true

      - name: Display Artifacts
        run: ls -R release-artifacts/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          # Collect all artifacts and pass them to gh release create as positional arguments
          gh release create "$tag" \
              --repo="${GITHUB_REPOSITORY}" \
              --title="${GITHUB_REPOSITORY#*/} ${tag#v}" \
              --generate-notes \
              $(find release-artifacts -type f -print0 | xargs -0)
