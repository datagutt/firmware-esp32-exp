dependencies:
  # koiosdigital fork of espressif 1.7.0: fixes cross-task TLS teardown
  # use-after-free (senders defer transport aborts to the websocket task)
  esp_websocket_client:
    git: https://github.com/koiosdigital/esp_websocket_client.git
    version: v1.7.1
  esp-hub75:
    git: https://github.com/datagutt/esp-hub75.git
    # Pinned commit for reproducible builds; bump when the fork advances.
    # bc063a5: internal-RAM driver allocation (on top of ba0e60a gpio drive
    # strength + fused row-pair draw path + c6 fixes).
    version: bc063a51cd6ec4616a9ef2ac32b35dbc36866d63
    path: components/hub75
  espressif/cjson: "*"
  espressif/mdns: "*"
  joltwallet/littlefs: "*"
